# Comparte la red externa `rebusque-net` con base-datos/ (creada una sola vez,
# ver base-datos/README.md). El backend resuelve Postgres por nombre de
# contenedor: `rebusque-db`.
version: '3.8'

networks:
  rebusque-net:
    external: true

services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/rebusque-backend:latest
    container_name: rebusque-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:5002:5002"
    networks:
      - rebusque-net
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
